<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aral Quest – English and Filipino Fun</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#8b5cf6;--on:#fff;--card:#fff;--ink:#1f2340;--bg:color-mix(in srgb,var(--c) 14%,#fff);--soft:color-mix(in srgb,var(--c) 22%,#fff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#23253f;--ink:#f1f2ff;--bg:color-mix(in srgb,var(--c) 18%,#14152a);--soft:color-mix(in srgb,var(--c) 30%,#23253f)}}
:root[data-theme="dark"]{--card:#23253f;--ink:#f1f2ff;--bg:color-mix(in srgb,var(--c) 18%,#14152a);--soft:color-mix(in srgb,var(--c) 30%,#23253f)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-size:18px;transition:background .6s;overflow-x:hidden}
#app{max-width:640px;margin:0 auto;padding:16px;position:relative;z-index:2}
.scr{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.bg span{position:fixed;font-size:34px;opacity:.35;animation:fl 9s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes fl{50%{transform:translateY(-40px) rotate(20deg)}}
.owl{font-size:96px;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(-6deg)}}
.bub,.card{background:var(--card);border:4px solid var(--c);border-radius:26px;padding:16px 18px;margin:12px 0;box-shadow:0 6px 0 var(--c);line-height:1.35}
.bub{min-height:90px;font-size:20px}
h1,h2{margin:6px 0;text-align:center;color:var(--c);filter:brightness(.85)}
h1{font-size:38px}
.btn{position:relative;overflow:hidden;font:inherit;font-weight:800;border:0;border-radius:20px;padding:12px 22px;background:var(--c);color:var(--on);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 60%,#000);cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s;margin:6px 4px}
.btn:hover{transform:translateY(-4px) rotate(-1deg);filter:brightness(1.1)}
.btn:active{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 60%,#000)}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.btn.sm{padding:6px 14px;font-size:16px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:rp .6s forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
input{width:100%;font:inherit;font-size:22px;padding:12px 16px;border-radius:18px;border:4px solid var(--c);background:var(--card);color:var(--ink);text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:block;width:100%;text-align:center;font-size:24px;padding:22px 10px;margin:0}
.cat b{display:block;font-size:52px}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:12px 0}
.sw button{width:58px;height:58px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer;transition:transform .2s}
.sw button:hover{transform:scale(1.25) rotate(15deg)}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:16px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .5s}
.q{font-size:21px;font-weight:700}
.passage{font-size:19px;line-height:1.6;font-weight:500}
.opts{display:grid;gap:8px}
.opt{background:var(--card);color:var(--ink);border:4px solid var(--c);box-shadow:0 5px 0 var(--c);text-align:left;margin:0}
.opt.ok{background:#22c55e;color:#fff;animation:jump .5s}
.opt.no{background:#ef4444;color:#fff;animation:shake .4s}
@keyframes jump{40%{transform:scale(1.07) rotate(-2deg)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.shake{animation:shake .4s}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:50px;height:54px;font-size:26px;padding:0;margin:0}
.slot{width:46px;height:52px;border-bottom:5px solid var(--c);font-size:30px;font-weight:800;text-align:center;color:var(--c)}
.cf{position:fixed;top:-40px;font-size:30px;animation:fall 2.4s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.stars{font-size:60px;text-align:center}
#cv{width:100%;height:260px;border:4px dashed var(--c);border-radius:22px;background:var(--card);touch-action:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chips .btn{padding:4px 10px;font-size:20px;margin:2px;font-family:"Dancing Script",cursive}
.fb{font-size:22px;font-weight:800;text-align:center;min-height:32px}
.rv{border-top:2px dashed var(--c);margin-top:8px;padding-top:8px;font-size:17px;line-height:1.4}
html{scroll-behavior:smooth}
::-webkit-scrollbar{width:18px;height:18px}
::-webkit-scrollbar-track{background:repeating-linear-gradient(45deg,var(--soft) 0 8px,var(--bg) 8px 16px);border-radius:12px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff),var(--c));border:4px solid var(--bg);border-radius:14px;box-shadow:0 0 10px var(--c);transition:filter .2s}
::-webkit-scrollbar-thumb:hover{filter:brightness(1.25) saturate(1.3)}
::-webkit-scrollbar-thumb:active{filter:brightness(.85)}
@supports not selector(::-webkit-scrollbar){html{scrollbar-width:auto;scrollbar-color:var(--c) var(--soft)}}
#sp{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;pointer-events:none}
#sp i{display:block;height:10px;width:0;border-radius:0 8px 8px 0;background:repeating-linear-gradient(45deg,var(--c) 0 12px,color-mix(in srgb,var(--c) 55%,#fff) 12px 24px);background-size:34px 34px;animation:stripe .7s linear infinite;box-shadow:0 0 14px var(--c);transition:width .15s}
@keyframes stripe{to{background-position:34px 0}}
#sp b{position:absolute;top:calc(env(safe-area-inset-top,0px) - 10px);left:0;font-size:26px;transform:rotate(45deg);transition:left .15s;filter:drop-shadow(0 0 6px var(--c))}
#up{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;padding:0;margin:0;z-index:20;transform:scale(0);font-size:24px}
#up.on{transform:scale(1);animation:bnc 1.4s ease-in-out infinite}
@keyframes bnc{50%{transform:translateY(-8px)}}
.passage p{margin:0 0 14px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{height:84px;margin:0;font-size:20px;padding:4px}
.mc.up{background:var(--card);color:var(--ink);border:4px solid var(--c);animation:fp .35s}
.mc.dn{background:#22c55e;color:#fff;animation:jump .5s}
@keyframes fp{from{transform:rotateY(90deg)}to{transform:none}}
.btn:disabled{opacity:.3;transform:none;cursor:default}
.guide{display:flex;align-items:center;gap:6px;cursor:pointer}.gb{flex:1;text-align:left;margin:0;font-size:17px}.gchar{animation:bob 2.4s ease-in-out infinite;flex:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--c);color:var(--on);padding:10px 18px;border-radius:20px;font-weight:800;z-index:30;animation:tst 1.9s forwards;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
@keyframes tst{0%{opacity:0;transform:translate(-50%,20px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div class="bg"><span style="left:5%;top:12%">⭐</span><span style="left:88%;top:20%;animation-delay:1s">📚</span><span style="left:8%;top:70%;animation-delay:2s">✏️</span><span style="left:90%;top:75%;animation-delay:3s">🌈</span><span style="left:48%;top:92%;animation-delay:4s">🎈</span></div>
<div id="app"></div>
<div id="sp"><i></i><b>🚀</b></div><button class="btn" id="up" aria-label="Back to top" onclick="scrollTo({top:0,behavior:'smooth'});boom(12)">⬆</button>
<script>
const $=s=>document.querySelector(s),app=$("#app");
let S={name:"",c:"#8b5cf6",stars:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("ps")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ps",JSON.stringify(S))}catch(e){}window.onSave&&window.onSave()};
S.best=S.best||{};S.hist=S.hist||[];
function rec(key,label,sc,tot){const b=S.best[key],nw=!b||sc>b.sc;if(nw)S.best[key]={sc,tot,label};S.hist.unshift({label,sc,tot,d:new Date().toLocaleDateString()});S.hist=S.hist.slice(0,10);save();if(sc>0)setTimeout(()=>toast('+'+sc+' 🪙 coins!'),600);return{nw,best:S.best[key]}}
const recHTML=R=>R.nw?"🏅 New highest score!":"🏅 Highest score: "+R.best.sc+" / "+R.best.tot;
const wrongHTML=W=>W.length?'<div class="card"><b>📝 Let’s review ('+W.length+'):</b>'+W.map(w=>'<div class="rv">❓ '+w.q+'<br>❌ Your answer: <s>'+w.m+'</s><br>✅ Correct: <b>'+w.r+'</b></div>').join("")+'</div>':'<div class="card" style="text-align:center">💯 Perfect! No wrong answers!</div>';
const quiz2=(items,key,back)=>{const [k,t]=key.split("-");quiz(items,back,key,(k=="en"?"English ":"Filipino ")+(t=="quiz"?"Quiz":t=="gram"?"Grammar Test":t=="mix"?"Mixed Challenge":t=="deep"?"Deep Words":t[0]=="L"?"Level "+t[1]+": "+LN[k][t[1]-1].slice(3):t=="tf"?"True or False":"Story: "+D[k].read[+t.slice(4)].t))};
function board(){const B=Object.values(S.best),H=S.hist;show(`<button class="btn sm" onclick="home()">⬅ Home</button><h1>🏆 Scoreboard</h1><div class="card" style="text-align:center">⭐ Total stars: <b>${S.stars}</b></div>${dash()}${badges()}<button class="btn cat" style="margin-top:10px" onclick="rep()"><b>📤</b>Export Progress</button><h2 style="font-size:22px">🥇 Highest scores</h2><div class="card">${B.length?B.map(b=>`<div class="rv" style="display:flex;justify-content:space-between;gap:8px"><span>${b.label}</span><b>${b.sc} / ${b.tot}</b></div>`).join(""):"Play a game to set your first record!"}</div><h2 style="font-size:22px">🕒 Recent games</h2><div class="card">${H.length?H.map(h=>`<div class="rv">${h.label}: <b>${h.sc} / ${h.tot}</b> <small>${h.d}</small></div>`).join(""):"Nothing yet. Let’s play!"}</div>`)}
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function theme(c){S.c=c;const r=document.documentElement.style;r.setProperty("--c",c);const n=parseInt(c.slice(1),16),L=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);r.setProperty("--on",L>150?"#1f2340":"#fff")}
function show(h){app.innerHTML='<div class="scr">'+h+'</div>';scrollTo(0,0)}
function type(el,t,cb){let i=0;el.textContent="";(function f(){if(i<t.length){el.textContent+=t[i++];setTimeout(f,24)}else cb&&cb()})()}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function boom(n=30){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","⭐","✨","🎊","💖"][i%5];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn");if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement("span"),d=Math.max(r.width,r.height);s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});

/* ---------- Intro ---------- */
function intro(){show('<div class="owl">🦉</div><div class="bub" id="t"></div><div id="x"></div>');
type($("#t"),"Hello, friend! I’m Owly, your learning buddy! 🌟 Together we’ll play games, solve puzzles, read stories and become English and Filipino champions! First, what’s your name?",()=>{$("#x").innerHTML='<input id="nm" maxlength="16" placeholder="Type your name here…" autocomplete="off"><div style="text-align:center"><button class="btn" onclick="gotName()">That’s me! 🚀</button></div>';$("#nm").focus()})}
function gotName(){const v=$("#nm").value.trim();if(!v){$("#nm").classList.add("shake");setTimeout(()=>$("#nm").classList.remove("shake"),400);return}
S.name=v;save();show('<div class="owl">🦉</div><div class="bub" id="t"></div><div id="x"></div>');
type($("#t"),"Wow, "+v+"! What an awesome name! ✨ Nice to meet you! Now tell me, what is your favorite color? Pick one and I’ll paint the whole game with it! 🎨",()=>{$("#x").innerHTML='<div class="sw">'+["#ef4444","#f97316","#facc15","#22c55e","#14b8a6","#3b82f6","#8b5cf6","#ec4899"].map(c=>`<button style="background:${c}" aria-label="${c}" onclick="pick('${c}')"></button>`).join("")+'</div><div style="text-align:center">Or choose your own: <input type="color" id="cc" style="width:70px;padding:2px" onchange="pick(this.value)"></div>'})}
function pick(c){theme(c);save();boom(20);show('<div class="owl">🎨</div><div class="bub" id="t"></div>');type($("#t"),"Ooooh, "+esc(S.name).replace(/&amp;/g,"&")+"! Great choice! Look, the whole world just changed color! 🌈 Let’s go!",()=>setTimeout(home,900))}

/* ---------- Home ---------- */
function home(){IF=0;show(`<h1>Hi, ${esc(S.name)}! 👋</h1><div class="card" style="text-align:center">⭐ <b>${S.stars}</b> stars · 🪙 <b>${coins()}</b> coins · Level ${lvl()}<div class="bar" style="margin:8px 0"><i style="width:${S.stars%25*4}%"></i></div><small>${25-S.stars%25} more stars to level up!</small></div>${dash()}<div class='guide' onclick='tip(this)'><div class='gchar'>${char(110)}</div><div class='card gb'>💬 ${TIPS[Math.random()*TIPS.length|0]}</div></div>
<div class="grid"><button class="btn cat" onclick="cat('en')"><b>📘</b>English</button><button class="btn cat" onclick="cat('fil')"><b>🇵🇭</b>Filipino</button></div>
<div class="grid" style="margin-top:12px"><button class="btn cat" onclick="cat2('sci')"><b>🔬</b>Science</button><button class="btn cat" onclick="cat2('math')"><b>➗</b>Math</button></div><div class="grid" style="margin-top:12px"><button class="btn cat" onclick="cat2('ap')"><b>🌏</b>Araling Panlipunan</button><button class="btn cat" onclick="cat2('esp')"><b>💖</b>EsP</button><button class="btn cat" onclick="cat2('mapeh')"><b>🎨</b>MAPEH</button><button class="btn cat" onclick="cat2('epp')"><b>🛠️</b>EPP</button></div><button class="btn cat" style="margin-top:12px" onclick="shop()"><b>🛍️</b>Owly Shop and Dress-up</button><button class="btn cat" style="margin-top:12px" onclick="games()"><b>🎮</b>Fun Games</button><button class="btn cat" style="margin-top:12px" onclick="pbooth()"><b>📸</b>Photo Booth</button><button class="btn cat" style="margin-top:12px" onclick="cursive()"><b>✍️</b>Cursive Writing Guide</button>
<button class="btn cat" style="margin-top:12px" onclick="board()"><b>🏆</b>Scoreboard and Highest Scores</button>
<div style="text-align:center"><button class="btn sm" onclick="intro()">🔄 Change name or color</button><button class="btn sm" onclick="secret()">🔑 Secret code</button><button class="btn sm" onclick="S.mute=!S.mute;save();home()">${S.mute?"🔇 Sound off":"🔊 Sound on"}</button><button class="btn sm" onclick="S.music=!S.music;save();music(S.music);home()">${S.music?"🎵 Music on":"🎵 Music off"}</button></div>`)}
function cat(k){IF=k=="fil";const n=k=="en"?"English 📘":"Filipino 🇵🇭";show(`<button class="btn sm" onclick="home()">⬅ Home</button><h2>${n}</h2>${pbar(k)}<button class="btn cat" onclick="lv('${k}')"><b>🎚️</b>${k=="en"?"Challenge Levels":"Mga Antas ng Hamon"}</button>
<button class="btn cat" style="margin-top:10px" onclick="mix('${k}')"><b>🎲</b>${k=="en"?"Mixed Challenge":"Halo-halong Hamon"}</button>
<button class="btn cat" onclick="quiz2(D.${k}.quiz,'${k}-quiz','cat(\\'${k}\\')')"><b>🧠</b>Quiz Time</button>
<button class="btn cat" style="margin-top:10px" onclick="scr('${k}')"><b>🔤</b>Word Scramble</button>
<button class="btn cat" style="margin-top:10px" onclick="go('${k}','deep')"><b>🔍</b>${k=="en"?"Deep Words":"Malalalim na Salita"}</button>
<button class="btn cat" style="margin-top:10px" onclick="go('${k}','gram')"><b>📐</b>${k=="en"?"Grammar Test":"Pagsusulit sa Balarila"}</button>
<button class="btn cat" style="margin-top:10px" onclick="go('${k}','tf')"><b>⚡</b>${k=="en"?"True or False":"Tama o Mali"}</button>
<button class="btn cat" style="margin-top:10px" onclick="mt('${k}')"><b>🃏</b>${k=="en"?"Match the Pairs":"Itugma ang Pares"}</button>
<button class="btn cat" style="margin-top:10px" onclick="sb('${k}')"><b>🧩</b>${k=="en"?"Sentence Builder":"Buuin ang Pangungusap"}</button>
<button class="btn cat" style="margin-top:10px" onclick="readList('${k}')"><b>📖</b>${k=="en"?"Read and Understand":"Magbasa at Umunawa"}</button>`)}

/* ---------- Quiz engine ---------- */
function quiz(items,back,key,label){const it=shuf(items).map(x=>{const c=x.o[x.a],o=x.f?x.o:shuf(x.o);return{q:x.q,o,a:o.indexOf(c)}});let i=0,sc=0,W=[];
function r(){if(i>=it.length)return end();const x=it[i];
show(`<div class="top"><button class="btn sm" onclick="${back}">⬅</button><div class="bar"><i style="width:${i/it.length*100}%"></i></div><b>⭐${sc}</b></div><div class="card q">${x.q}</div><div class="opts">${x.o.map((o,k)=>`<button class="btn opt" data-k="${k}">${o}</button>`).join("")}</div><div class="fb" id="fb"></div><div style="text-align:center" id="nx"></div>`);
let done=0;app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;done=1;const k=+b.dataset.k;
if(k==x.a){b.classList.add("ok");sc++;snd(880);boom(10);$("#fb").textContent=["🎉 Correct!","🌟 Great job!","💪 You’re awesome!"][i%3]}
else{snd(220);b.classList.add("no");W.push({q:x.q,m:b.textContent,r:x.o[x.a]});app.querySelectorAll(".opt")[x.a].classList.add("ok");$("#fb").textContent="Oops! Good try! Keep going! 💙"}
$("#nx").innerHTML='<button class="btn" id="nb">'+(i+1<it.length?"Next ➡":"Finish 🏁")+'</button>';$("#nb").onclick=()=>{i++;r()}})}
function end(){S.stars+=sc;const R=rec(key,label,sc,it.length),p=sc/it.length;boom(p>.6?50:15);
show(`<div class="stars">${p>=.8?"🏆":p>=.5?"🌟":"💪"}</div><h2>${p>=.8?"Amazing":p>=.5?"Nice work":"Keep practicing"}, ${esc(S.name)}!</h2><div class="card" style="text-align:center;font-size:24px">Score: ${sc} / ${it.length}<br>+${sc} ⭐<br>${recHTML(R)}</div>${wrongHTML(W)}<div style="text-align:center"><button class="btn" id="ag">🔁 Play again</button><button class="btn" onclick="${back}">⬅ Back</button></div>`);$("#ag").onclick=()=>quiz(items,back,key,label)}
r()}

/* ---------- Word scramble ---------- */
function scr(k){const W=shuf(D[k].words),X=[];let i=0,sc=0;
function r(a=[]){if(i>=W.length){S.stars+=sc;const R=rec("pz"+k,(k=="en"?"English":"Filipino")+" Puzzle",sc,W.length);boom(40);return show(`<div class="stars">🔤🏆</div><h2>Word Wizard!</h2><div class="card" style="text-align:center;font-size:24px">${sc} / ${W.length} words<br>+${sc} ⭐<br>${recHTML(R)}</div>${wrongHTML(X)}<div style="text-align:center"><button class="btn" onclick="scr('${k}')">🔁 Again</button><button class="btn" onclick="cat('${k}')">⬅ Back</button></div>`)}
const [w,h]=W[i];if(!r.t||r.w!=w){let t;do{t=shuf(w.split(""))}while(t.join("")==w);r.t=t;r.w=w}
show(`<div class="top"><button class="btn sm" onclick="cat('${k}')">⬅</button><div class="bar"><i style="width:${i/W.length*100}%"></i></div><b>⭐${sc}</b></div>
<div class="card" style="text-align:center">💡 ${h}</div>
<div class="tiles" style="margin:18px 0">${w.split("").map((_,j)=>`<div class="slot">${a[j]!=null?r.t[a[j]]:""}</div>`).join("")}</div>
<div class="tiles">${r.t.map((l,j)=>`<button class="btn tile" data-j="${j}" ${a.includes(j)?"disabled style='opacity:.3'":""}>${l}</button>`).join("")}</div>

read:[{t:"The Banaue Rice Terraces",x:"High in the mountains of Ifugao, in the northern Philippines, stand the Banaue Rice Terraces. They are often called the Eighth Wonder of the World because they are so huge and so beautiful. The terraces look like giant green stairs that climb the hills toward the clouds.|The Ifugao people carved these terraces into the mountainsides long, long ago. Many stories say it happened more than 2,000 years back. They had no big machines. They used simple hand tools, strong arms and a lot of patience. Stone walls and packed mud hold each step in place so the soil does not slide down the slope.|Water is very important for growing rice. The Ifugao built a clever system of bamboo pipes and canals that brings water from the forests above down to every field. Because of this, even the highest terraces get enough water.|Today, farmers still plant and harvest rice here, just as their grandparents did. Families work together during planting season, singing songs and sharing food. Visitors from all over the world come to see the terraces. The Ifugao teach us that when people work together and care for nature, they can create something that lasts for a very long time.",qs:[Q("What holds each step of the terraces in place?",["Stone walls and packed mud","Plastic pipes","Metal fences","Big machines"]),Q("What can we learn from the Ifugao?",["Working together and caring for nature makes lasting things","Machines are always better","Mountains are scary","Rice grows only in cities"]),Q("Where are the Banaue Rice Terraces?",["Ifugao","Cebu","Davao","Palawan"]),Q("What do the terraces look like?",["Giant green stairs","Tall towers","Blue lakes","Sandy beaches"]),Q("How do all the fields get water?",["Through canals","By rain only","By trucks","From wells"]),Q("What is the main idea?",["The terraces are an amazing work of the Ifugao people.","Rice is cheap.","Mountains are cold.","Tools are heavy."])]},
{t:"Mia and the Lost Puppy",x:"Mia was walking home from school one rainy afternoon. Her bag was heavy and her shoes were wet, so she walked fast. Suddenly, she heard a soft cry coming from behind a bush.|Mia knelt down and peeked inside. A tiny brown puppy was shivering in the cold rain. His fur was muddy, and he had no collar. “Oh, you poor little thing,” Mia whispered. She took off her jacket and wrapped him up warmly.|She carried the puppy from house to house and asked every neighbor, “Is this your puppy?” Nobody knew him. Mia began to worry. It was getting dark, and she knew her mother would be waiting for her.|Finally, old Mang Ben, who sold fish at the corner, looked closely at the puppy. “That is Bantay!” he said. “He belongs to the little boy near the church.” Mang Ben led Mia to a small house where a boy was sitting on the steps, crying.|When the boy saw the puppy, his eyes lit up. “Bantay!” he shouted, hugging him tightly. Then he hugged Mia too. “Thank you for finding him!” Mia smiled all the way home. She was wet and late, but her heart felt warm and happy.",qs:[Q("What was the puppy’s name?",["Bantay","Brownie","Mia","Ben"]),Q("How did Mia feel at the end of the story?",["Warm and happy","Angry","Bored","Afraid"]),Q("Where did Mang Ben take Mia?",["To the small house of the boy near the church","To the school","To the market","To her home"]),Q("Why was the puppy shivering?",["It was wet and cold","It was hungry","It was angry","It was sleepy"]),Q("What did Mia do first to help?",["Wrapped him in her jacket","Called the police","Went to sleep","Bought food"]),Q("Which word best describes Mia?",["Kind","Lazy","Rude","Shy"]),Q("Who found the owner?",["Mang Ben","Mia’s mother","The teacher","The puppy"])]},
{t:"The Brave Little Firefly",x:"In a dark forest lived a little firefly named Lani. Every night, the other animals laughed at her. “Your light is too small,” said the owl. “It cannot help anyone,” said the frog. Lani felt sad, but she kept glowing.|One stormy night, a baby rabbit got lost in the forest. The moon was hidden behind thick clouds, and the paths were too dark to see. The baby rabbit cried for his mother.|Lani heard him and flew down at once. “Follow me,” she said. Her little light glowed softly in the dark. She led the baby rabbit past the muddy pond, over a fallen log and through the tall grass.|At last, they reached the rabbit’s burrow. His mother hugged him and thanked Lani again and again. The next morning, the owl and the frog said sorry. “We were wrong,” said the owl. “Even a small light can do great things.” From that day on, Lani glowed proudly every night.",qs:[Q("Who is Lani?",["A little firefly","A baby rabbit","An owl","A frog"]),Q("Why did the animals laugh at Lani?",["They thought her light was too small","She was very loud","She was lazy","She could not fly"]),Q("What problem did the baby rabbit have?",["He was lost in the dark forest","He was hungry","He was sick","He lost his toy"]),Q("How did Lani help the baby rabbit?",["She lit the way home with her glow","She carried him on her back","She called his mother","She gave him food"]),Q("What does the word <b>burrow</b> mean?",["A hole where a rabbit lives","A tall tree","A muddy pond","A fallen log"]),Q("What lesson does the story teach?",["Even small things can do great things","Never go out at night","Only big animals are strong","Rabbits are fast"])]},
{t:"Saving Our Seas",x:"The ocean covers most of our planet, and it is home to millions of living things. Fish, turtles, whales and colorful corals all depend on clean water to survive. Sadly, our seas are in danger.|Every year, tons of plastic bottles, bags and straws end up in the ocean. Sea turtles sometimes mistake plastic bags for jellyfish and eat them, which makes them very sick. Some birds and fish also get tangled in old nets and plastic rings.|The good news is that everyone can help. We can bring reusable bags and water bottles instead of using plastic ones. We can say no to plastic straws, throw our trash in the proper bins and join beach clean-ups with our families and friends.|Small actions add up. If every student in a school does one small thing each day, thousands of pieces of trash will never reach the sea. A clean ocean means a healthy home for sea animals and a better future for all of us.",qs:[Q("Why do sea turtles eat plastic bags?",["They mistake them for jellyfish","They are hungry for plastic","They like the color","They want to play"]),Q("What is the main idea of the passage?",["We must protect the ocean by reducing trash","Turtles are the biggest sea animals","Plastic is cheap","Beaches are fun"]),Q("Which action helps the ocean?",["Bringing a reusable water bottle","Using more plastic straws","Throwing trash in the sea","Leaving trash on the beach"]),Q("What does the word <b>tangled</b> mean?",["twisted and caught","washed clean","very happy","far away"]),Q("What happens if every student does one small thing each day?",["Thousands of pieces of trash will not reach the sea","The sea will dry up","Nothing will change","Plastic will disappear at once"]),Q("Which of these animals is mentioned as hurt by plastic?",["Sea turtles","Elephants","Monkeys","Horses"])]}]},

read:[{t:"Ang Pagong at ang Matsing",x:"Isang umaga, naglalakad sa tabi ng ilog sina Pagong at Matsing. Nakakita sila ng isang puno ng saging na palutang-lutang sa tubig. “Akin ang puno!” sabi ni Matsing. “Hindi, sa akin!” sabi ni Pagong. Pagkatapos ng kaunting pagtatalo, nagkasundo silang hatiin ito.|Kinuha ni Matsing ang itaas na bahagi na may mga dahon, dahil akala niya ay mas mabilis itong mamunga. Kinuha naman ni Pagong ang ibabang bahagi na may ugat. Masaya silang nagtanim sa kani-kanilang bakuran.|Makalipas ang ilang araw, natuyo ang itinanim ni Matsing dahil wala itong ugat. Samantala, lumaki ang tanim ni Pagong at namunga ng maraming hinog na saging. Nainggit si Matsing.|Hindi makaakyat si Pagong sa puno kaya humingi siya ng tulong kay Matsing. Umakyat si Matsing at kumain nang kumain. Inubos niya ang mga saging at iniwan kay Pagong ang balat. Nagalit si Pagong at nag-isip ng paraan.|Naglagay si Pagong ng matutulis na tinik sa paligid ng puno at nagtago sa loob ng isang bao. Nang bumaba si Matsing, natinik siya at napasigaw sa sakit. Mula noon, natutunan ni Matsing na hindi mabuti ang maging sakim at mapanlinlang.",qs:[Q("Ano ang inilagay ni Pagong sa paligid ng puno?",["Matutulis na tinik","Mga bato","Mga bulaklak","Mga lubid"]),Q("Bakit nainggit si Matsing?",["Namunga ang tanim ni Pagong","Mas malaki ang bahay ni Pagong","Mas mabilis tumakbo si Pagong","Marami siyang kaibigan"]),Q("Ano ang nakita nina Pagong at Matsing?",["Puno ng saging","Puno ng mangga","Isang bangka","Isang bahay"]),Q("Bakit natuyo ang tanim ni Matsing?",["Itaas na bahagi ito na walang ugat","Walang araw","Hindi niya dinilig","Kinain ng ibon"]),Q("Anong ugali ang ipinakita ni Matsing?",["Madamot","Matulungin","Mapagpakumbaba","Matapat"]),Q("Ano ang aral ng kuwento?",["Huwag maging madamot at mapanlinlang","Maglaro buong araw","Matulog nang maaga","Kumain ng saging"])]},
{t:"Ang Bayanihan",x:"Sa isang tahimik na baryo sa tabi ng bukid, nakatira si Mang Isko at ang kanyang pamilya. Isang araw, kinailangan nilang lumipat ng tirahan dahil magtatayo ng paaralan sa lugar nila. Gawa sa kawayan at nipa ang kanilang munting bahay.|Nang malaman ito ng mga kapitbahay, nagtipon sila sa harap ng bahay ni Mang Isko. “Tutulungan ka namin!” sabi ni Mang Berto. Nagdala sila ng malalakas na kawayan at lubid, at pumuwesto sa magkabilang gilid ng bahay.|“Isa, dalawa, tatlo, buhat!” sigaw nila. Dahan-dahang nabuhat ang bahay. Habang naglalakad sila papunta sa bagong lote, nag-aawitan sila at nagtatawanan, kaya hindi nila ramdam ang pagod. Sumunod ang mga bata at nagdala ng mga maliliit na gamit.|Pagdating sa bagong lote, maingat nilang ibinaba ang bahay. Dumating din si Aling Rosa na may dalang meryendang suman at salabat para sa lahat. Masaya silang kumain sa ilalim ng puno.|“Maraming salamat po sa inyong lahat,” sabi ni Mang Isko na naluluha sa tuwa. Ito ang tinatawag na bayanihan, ang kaugaliang Pilipino na pagtutulungan nang walang hinihintay na kapalit. Kapag sama-sama, gumagaan ang lahat ng gawain.",qs:[Q("Bakit kinailangang lumipat ni Mang Isko?",["Magtatayo ng paaralan sa lugar nila","Nasunog ang bahay","Malayo ang palengke","Ayaw niya sa kapitbahay"]),Q("Ano ang ginawa nila habang naglalakad?",["Nag-aawitan at nagtatawanan","Nag-away","Natulog","Tahimik na umiyak"]),Q("Sino ang lilipat ng tirahan?",["Mang Isko","Aling Rosa","Pagong","Mia"]),Q("Saan gawa ang bahay?",["Kawayan at nipa","Bato at semento","Bakal","Yelo"]),Q("Ano ang ibig sabihin ng bayanihan?",["Pagtutulungan","Pag-aaway","Paglalaro","Pagtulog"]),Q("Ano ang dala ni Aling Rosa?",["Meryenda","Kawayan","Damit","Libro"])]},
{t:"Ang Alamat ng Pinya",x:"Noong unang panahon, may batang babae na ang pangalan ay Pinang. Mahal na mahal siya ng kanyang inang si Aling Rosa kaya lahat ng gusto niya ay ibinibigay nito. Dahil dito, lumaking tamad at pasaway si Pinang. Wala siyang ginagawa kundi maglaro buong araw.|Isang araw, nagkasakit si Aling Rosa. “Pinang, anak, ipagluto mo naman ako ng lugaw,” mahina niyang sabi. Ngunit hindi alam ni Pinang kung saan nakalagay ang mga kagamitan. “Inay, nasaan po ang posporo? Nasaan po ang kaldero?” tanong niya nang paulit-ulit. Napagod ang kanyang ina sa kasasagot.|“Sana magkaroon ka ng maraming mata para makita mo ang lahat ng hinahanap mo!” wika ni Aling Rosa dahil sa sobrang inis. Hindi nagtagal, nawala si Pinang.|Isang umaga, may tumubong kakaibang halaman sa kanilang bakuran. Ang bunga nito ay may maraming mata sa balat. Tinawag itong pinya, mula sa pangalang Pinang. Itinuturo ng alamat na ito na dapat tayong maging masipag at matulungin sa ating mga magulang.",qs:[Q("Sino si Pinang?",["Isang batang tamad at pasaway","Isang matandang magsasaka","Isang guro","Isang mangingisda"]),Q("Bakit lumaking tamad si Pinang?",["Ibinibigay ng kanyang ina ang lahat ng gusto niya","Maraming trabaho sa bahay","Walang kalaro","Palagi siyang may sakit"]),Q("Ano ang ipinaluto ni Aling Rosa kay Pinang?",["Lugaw","Adobo","Sinigang","Tinola"]),Q("Ano ang tumubo sa kanilang bakuran?",["Pinya","Saging","Mangga","Niyog"]),Q("Bakit maraming mata ang pinya?",["Dahil sa sinabi ni Aling Rosa na magkaroon si Pinang ng maraming mata","Dahil maraming ibon","Dahil malaki ang bakuran","Dahil umulan nang malakas"]),Q("Ano ang aral ng alamat?",["Maging masipag at matulungin sa magulang","Maglaro buong araw","Huwag magluto","Huwag makinig sa nanay"])]},
{t:"Si Dr. Jose Rizal",x:"Si Dr. Jose Rizal ay isinilang noong Hunyo 19, 1861 sa Calamba, Laguna. Ang kanyang mga magulang ay sina Francisco Mercado at Teodora Alonso. Siya ang ikapito sa labing-isang magkakapatid.|Maagang natuto si Rizal. Itinuro sa kanya ng kanyang ina ang alpabeto at mga dasal noong tatlong taong gulang pa lamang siya. Mahilig siyang magbasa, gumuhit at sumulat ng tula. Nag-aral siya sa Ateneo at sa Unibersidad ng Santo Tomas. Naging doktor siya ng mata at nag-aral din sa ibang bansa.|Isinulat niya ang dalawang tanyag na nobela, ang Noli Me Tangere at El Filibusterismo. Ipinakita ng mga aklat na ito ang mga pang-aabuso ng mga mananakop na Espanyol. Hindi siya gumamit ng armas; panulat ang kanyang sandata.|Noong Disyembre 30, 1896, binaril si Rizal sa Bagumbayan. Hanggang ngayon, minamahal at hinahangaan natin siya dahil sa kanyang tapang at pagmamahal sa bayan. Bilang mga kabataan, maipapakita natin ang ating pagmamahal sa bansa sa pamamagitan ng pag-aaral nang mabuti at pagiging mabuting mamamayan.",qs:[Q("Saan isinilang si Jose Rizal?",["Calamba, Laguna","Maynila","Cebu","Davao"]),Q("Ano ang dalawang nobelang isinulat ni Rizal?",["Noli Me Tangere at El Filibusterismo","Florante at Laura","Ibong Adarna at Noli","Darna at Dyesebel"]),Q("Ano ang ibig sabihin ng “panulat ang kanyang sandata”?",["Sumulat siya imbes na gumamit ng armas","Nagdala siya ng tabak","Nagbenta siya ng lapis","Nagpinta siya ng bahay"]),Q("Anong uri ng doktor si Rizal?",["Doktor ng mata","Doktor ng ngipin","Doktor ng hayop","Doktor ng puso"]),Q("Pang-ilang anak si Rizal sa labing-isang magkakapatid?",["Ikapito","Una","Ikatlo","Panghuli"]),Q("Paano natin maipapakita ang pagmamahal sa bayan?",["Mag-aral nang mabuti at maging mabuting mamamayan","Mag-away sa kapitbahay","Magtapon ng basura kahit saan","Huwag pumasok sa paaralan"])]}]}};

D.en.read.push({t:'Kiko’s Science Fair',x:'Kiko loved plants more than anything. When his teacher announced a science fair, he decided to find out whether plants grow better with music.|He planted three small beans in three cups. He placed the first cup near a speaker that played soft music. The second cup stayed in a quiet corner, and the third one sat near a loud, noisy radio. Every day, he watered the beans and wrote down how tall each one grew.|After two weeks, Kiko noticed something surprising. The bean near the soft music was the tallest, while the bean near the loud radio was the shortest. “Maybe plants like peaceful sounds,” he said.|On the day of the fair, Kiko was nervous. His hands were shaking when the judges came to his table. But he took a deep breath and explained his experiment slowly. He showed his notes and his measurements.|Kiko did not win first prize, but the judges praised his hard work. “You asked a question and tested it carefully. That is what a real scientist does,” said one judge. Kiko smiled. He was already thinking of his next experiment.',qs:[Q('What did Kiko want to find out?',['Whether plants grow better with music','Whether beans taste good','How fast a radio works','Why the sky is blue']),Q('How many cups did Kiko use?',['Three','One','Two','Five']),Q('Which bean grew the tallest?',['The one near the soft music','The one near the loud radio','The one in the dark','The one in the sun']),Q('How did Kiko feel on the day of the fair?',['Nervous','Bored','Sleepy','Angry']),Q('What does the word <b>experiment</b> mean?',['A test to find out something','A kind of plant','A school prize','A loud radio']),Q('What lesson can we learn from Kiko?',['Curiosity and hard work matter more than prizes','Only winners are scientists','Never ask questions','Plants hate noise'])]},{t:'The Philippine Eagle',x:'The Philippine eagle is the national bird of the Philippines. It is one of the largest and strongest eagles in the world. Its wings can spread about two meters wide, and it has long feathers on its head that look like a crown. People once called it the monkey-eating eagle, but today we simply call it the Philippine eagle.|This mighty bird lives in the tall forests of Luzon, Samar, Leyte and Mindanao. It builds its nest high in the trees and hunts flying lemurs, snakes, bats and other small animals. A pair of eagles stays together for many years and lays only one egg every two years.|Sadly, the Philippine eagle is critically endangered. Only a few hundred pairs remain in the wild. Many forests have been cut down to make farms and towns, so the eagles lose their homes. Some are also hunted by people.|Today, groups like the Philippine Eagle Foundation in Davao City take care of eagles and protect their forests. We can help too by planting trees, respecting wildlife and learning more about our national bird. If we protect the forests, the eagle will soar in our skies for many years to come.',qs:[Q('What is the national bird of the Philippines?',['The Philippine eagle','The maya','The parrot','The owl']),Q('Why is the Philippine eagle in danger?',['Forests are cut down and some eagles are hunted','It cannot fly','There is too much food','It lives in the sea']),Q('How often does a pair of eagles lay one egg?',['Every two years','Every day','Every month','Every week']),Q('What does <b>critically endangered</b> mean?',['Very close to disappearing forever','Very big and strong','Very friendly','Very noisy']),Q('Where does the Philippine Eagle Foundation work?',['Davao City','Baguio City','Manila Bay','Iloilo City']),Q('Which action can help the eagle?',['Planting trees and protecting forests','Cutting more trees','Hunting animals','Building more roads in forests'])]});
D.fil.read.push({t:'Ang Pitaka sa Daan',x:'Pauwi na si Lito mula sa paaralan nang makakita siya ng isang itim na pitaka sa tabi ng kalsada. Dinampot niya ito at binuksan. Nakita niya ang maraming pera at isang ID card.|Naisip ni Lito ang bagong sapatos na matagal na niyang gustong bilhin. Ngunit naalala niya ang sinabi ng kanyang nanay: “Anak, huwag mong kukunin ang hindi sa iyo.” Alam niyang may nagmamay-ari ng pitaka at baka hinahanap na ito.|Dali-dali siyang pumunta sa barangay hall. Ibinigay niya ang pitaka kay Kapitan Ramon at ikinuwento ang nangyari. Tinawagan ng kapitan ang may-ari na nakasulat sa ID.|Makalipas ang ilang minuto, dumating si Mang Carlos na hingal na hingal. “Salamat, hijo! Para sa gamot ng asawa ko ang perang iyan,” sabi niya. Nais niyang bigyan si Lito ng gantimpala, ngunit tumanggi ang bata. “Masaya na po akong naibalik ko ito,” sagot niya.|Pinuri si Lito ng buong barangay. Umuwi siyang masaya dahil alam niyang tama ang kanyang ginawa.',qs:[Q('Ano ang nakita ni Lito sa tabi ng kalsada?',['Isang itim na pitaka','Isang payong','Isang sapatos','Isang libro']),Q('Ano ang naisip niyang bilhin?',['Bagong sapatos','Bagong bag','Laruan','Cellphone']),Q('Kanino ibinigay ni Lito ang pitaka?',['Kay Kapitan Ramon','Kay Mang Carlos','Sa guro','Sa kaibigan']),Q('Bakit kailangan ni Mang Carlos ang pera?',['Para sa gamot ng kanyang asawa','Para sa bagong bahay','Para sa pamasahe','Para sa laruan']),Q('Anong ugali ang ipinakita ni Lito?',['Katapatan','Kasakiman','Katamaran','Kayabangan']),Q('Ano ang aral ng kuwento?',['Huwag kunin ang hindi sa iyo; maging matapat','Itago ang napulot','Magpabayad palagi','Huwag magtiwala sa kapitan'])]},{t:'Ang Bulkang Mayon',x:'Ang Bulkang Mayon ay matatagpuan sa lalawigan ng Albay sa rehiyon ng Bicol. Kilala ito sa halos perpektong hugis-kono nito. Dinarayo ito ng mga turista mula sa iba’t ibang panig ng mundo.|Ito ay isa sa pinakaaktibong bulkan sa Pilipinas. Maraming beses na itong sumabog sa loob ng mga nakaraang taon. K async function act(a,id){
  const s=AD.list.find(x=>x.id==id);if(!s)return;let r;
  if(a=='ok')r=await api('admin_set_status',{p_token:AT,p_id:id,p_status:'approved',p_reason:''});
  else if(a=='no'){const w=prompt('Reason for '+(s.status=='approved'?'revoking':'rejecting')+' '+s.full_name+' (optional):','');if(w===null)return;r=await api('admin_set_status',{p_token:AT,p_id:id,p_status:'rejected',p_reason:w.slice(0,200)})}
  else if(a=='pw'){const p=prompt('Type a new temporary password for '+s.full_name+' (at least 6 characters):');if(p===null)return;if(p.length<6)return toast('Password is too short');r=await api('admin_reset_password',{p_token:AT,p_id:id,p_new:p});if(r.ok)alert('Password changed. Tell the student their new password: '+p)}
  else if(a=='del'){if(!confirm('Delete '+s.full_name+' permanently? Their progress will be lost.'))return;r=await api('admin_delete',{p_token:AT,p_id:id})}

}

const AQ_CHARACTER_PREFIX='aq1~';
function aqDecodeCharacter(value){
  const raw=String(value||'');
  if(raw.startsWith(AQ_CHARACTER_PREFIX)){
    const p=raw.split('~'),id=BASE[p[1]]?p[1]:'owl',eq={};
    ['hat','eyes','body','acc'].forEach((slot,i)=>{const v=p[i+2];if(v&&ITEMS.some(x=>x.id===v&&x.s===slot))eq[slot]=v});
    return{id,eq,color:/^#[0-9a-f]{6}$/i.test(p[6]||'')?p[6]:'',encoded:true};
  }
  return{id:BASE[raw]?raw:'owl',eq:{},color:'',encoded:false};
}
function aqEncodeCharacter(id=S.ch||'owl',eq=S.eq||{}){
  if(!BASE[id])id='owl';
  const parts=['aq1',id];
  ['hat','eyes','body','acc'].forEach(slot=>{const v=eq&&eq[slot],item=ITEMS.find(x=>x.id===v&&x.s===slot);parts.push(item?v:'')});
  const color=S.cc&&S.cc[id]||'';parts.push(/^#[0-9a-f]{6}$/i.test(color)?color:'');
  return parts.join('~');
}
function aqApplyCharacter(value){
  const d=aqDecodeCharacter(value);
  if(d.encoded){S.ch=d.id;S.eq=d.eq;if(d.color){S.cc=S.cc||{};S.cc[d.id]=d.color}}
  else if(BASE[String(value||'')])S.ch=d.id;
  if(!Array.isArray(S.own))S.own=[];S.eq=S.eq||{};
  if(S.ch!=='owl'&&!S.own.includes('c_'+S.ch))S.ch='owl';
  return d;
}
function aqCharacterVisual(value,w=88){
  const d=aqDecodeCharacter(value),old=S.cc;
  // Render another student's character from their saved look only; never borrow
  // the currently logged-in student's outfit or character tint.
  S.cc={...(old||{})};
  if(d.color)S.cc[d.id]=d.color;else delete S.cc[d.id];
  const svg=char(w,d.encoded?d.eq:{},d.id);
  S.cc=old;return svg;
}

  const hrs=Math.floor(mins/60);if(hrs<24)return 'Active '+hrs+' hour'+(hrs===1?'':'s')+' ago';
  const days=Math.floor(hrs/24);return 'Active '+days+' day'+(days===1?'':'s')+' ago';
};

const aqSubject=(key)=>{

function aqProgressSummary(progress){
  const best=progress&&progress.best&&typeof progress.best==='object'?progress.best:{};
  const groups={en:[],fil:[],sci:[],math:[],ap:[],esp:[],mapeh:[],epp:[],other:[]};
  Object.entries(best).forEach(([key,v])=>{const s=aqSubject(key);(groups[s]||groups.other).push({key,label:v.label||key,sc:+v.sc||0,tot:+v.tot||0})});

/* ---------- full-photo lightbox and password visibility toggles ---------- */
function aqInstallPhotoViewer(){
  if($('#aq-photo-lightbox'))return;
  const box=document.createElement('div');box.id='aq-photo-lightbox';box.className='aq-photo-lightbox';box.innerHTML='<button type="button" class="aq-photo-close" aria-label="Close photo">×</button><img alt="Expanded profile photo">';
  document.body.appendChild(box);

  document.addEventListener('click',e=>{const im=e.target.closest('.aq-fullphoto');if(!im)return;const src=im.dataset.photo||im.src;if(!src)return;box.querySelector('img').src=src;box.classList.add('open')});

function aqPasswordToggles(root=document){
  root.querySelectorAll('input[type="password"]').forEach(input=>{
    if(input.dataset.aqToggle==='1')return;input.dataset.aqToggle='1';
    const b=document.createElement('button');b.type='button';b.className='aq-pass-toggle';b.textContent='Show password';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Hide password':'Show password';b.setAttribute('aria-pressed',String(show))});
    input.insertAdjacentElement('afterend',b);
  });
}
new MutationObserver(()=>aqPasswordToggles(app)).observe(app,{childList:true,subtree:true});

/* ---------- screenshot/report helpers ---------- */
function aqWrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines=30){
  const words=String(text||'').split(/\s+/);let line='',lines=0;
  for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight;lines++;if(lines>=maxLines)return y} else line=test}
  if(line){ctx.fillText(line,x,y);y+=lineHeight}return y;
}
async function aqReportCanvas(title,profile,progress,opts={}){
  const c=document.createElement('canvas');c.width=1200;c.height=1600;const x=c.getContext('2d');
  x.fillStyle='#fffaf5';x.fillRect(0,0,c.width,c.height);x.fillStyle=S.c||'#8b5cf6';x.fillRect(0,0,c.width,18);
  x.fillStyle='#27213b';x.textAlign='center';x.font='bold 54px Arial';x.fillText('ARAL QUEST',600,100);x.font='bold 40px Arial';x.fillText(title,600,158);
  x.textAlign='left';let y=235;
  const photo=profile&&profile.photo;
  if(photo&&JPG.test(photo)){try{const im=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=photo});x.save();x.beginPath();x.arc(130,300,72,0,Math.PI*2);x.clip();x.drawImage(im,58,228,144,144);x.restore()}catch(e){}}
  x.fillStyle='#241f33';x.font='bold 38px Arial';x.fillText(String(profile&&profile.full_name||S.name||'Student').slice(0,50),235,275);
  x.font='24px Arial';x.fillStyle='#555';x.fillText('Student ID: '+String(profile&&profile.student_no||'—'),235,320);x.fillText('Grade: '+String(profile&&profile.grade||'—'),235,355);
  if(profile&&profile.bio){x.font='22px Arial';x.fillStyle='#6b6475';y=aqWrapText(x,'Bio: '+profile.bio,60,420,1080,32,2)+10}else y=435;
  x.strokeStyle=S.c||'#8b5cf6';x.lineWidth=4;x.beginPath();x.moveTo(60,y);x.lineTo(1140,y);x.stroke();y+=56;
  if(progress){const stars=+(progress.stars)||0,level=aqLevel(stars),best=progress.best||{};x.font='bold 30px Arial';x.fillStyle='#241f33';x.fillText('⭐ Total stars: '+stars+'      🏅 Level: '+level+'      📚 Activities: '+Object.keys(best).length,60,y);y+=62;
    const groups=aqProgressSummary(progress);x.font='bold 28px Arial';x.fillText('SUBJECT PROGRESS',60,y);y+=48;
    for(const g of groups){if(y>1430){break}x.font='bold 24px Arial';x.fillText(g.name+' — '+Math.round(g.percent)+'% ('+g.count+' activities)',70,y);y+=35;
      x.fillStyle='#eee8f6';x.fillRect(70,y-20,1040,16);x.fillStyle=S.c||'#8b5cf6';x.fillRect(70,y-20,1040*Math.max(0,Math.min(100,g.percent))/100,16);x.fillStyle='#241f33';y+=24;
      g.items.slice(0,8).forEach(v=>{if(y>1490)return;x.font='19px Arial';x.fillText('• '+String(v.label).slice(0,60)+' — '+v.sc+'/'+v.tot,95,y);y+=28});y+=12;
    }
    if(Array.isArray(progress.hist)&&progress.hist.length&&y<1480){x.font='bold 24px Arial';x.fillText('RECENT ACTIVITIES',60,y);y+=38;progress.hist.slice(0,6).forEach(h=>{x.font='19px Arial';x.fillText((h.label||'Activity')+' — '+h.sc+'/'+h.tot+' · '+(h.d||''),75,y);y+=29})}
  } else {
    x.font='bold 28px Arial';x.fillText('PROFILE INFORMATION',60,y);y+=54;
    const rows=[['Home address',profile&&profile.address],['Phone',profile&&profile.phone],['Email',profile&&profile.email],['Character',aqCharacter(profile&&profile.character_id)],['Bio',profile&&profile.bio]];
    rows.forEach(([k,v])=>{x.font='bold 22px Arial';x.fillText(k+':',70,y);x.font='22px Arial';y=aqWrapText(x,String(v||'—'),260,y,850,30,3)+16});
    if(opts.includePrivacy){x.font='22px Arial';x.fillText('Profile visibility: '+(profile.hide_profile?'Hidden':'Visible'),70,y);y+=34;x.fillText('Progress visibility: '+(profile.hide_progress?'Hidden':'Visible'),70,y);y+=34;x.fillText('Activity status: '+(profile.hide_active?'Hidden':'Visible'),70,y)}
  }
  x.fillStyle='#766d82';x.textAlign='center';x.font='18px Arial';x.fillText('Generated by Aral Quest · '+new Date().toLocaleString(),600,1555);
  return c;
}
function aqDownloadCanvas(canvas,name,type='image/png'){
  canvas.toBlob(async b=>{if(!b)return toast('Could not create the report.');saveFile(name,await b.arrayBuffer());toast('Saved successfully! ✅')},type);
}
async function aqExportReport(title,profile,progress,mode='png'){
  const cv=await aqReportCanvas(title,profile,progress,{includePrivacy:true});
  if(mode==='pdf') {
    if(!window.jspdf||!window.jspdf.jsPDF){toast('PDF export is unavailable. Check your internet connection and try again.');return;}
    const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,210,297);
    pdf.save('AralQuest-'+String(profile.full_name||'student').replace(/[^a-z0-9]+/gi,'-')+'-'+(progress?'progress':'profile')+'.pdf');
  } else aqDownloadCanvas(cv,'AralQuest-'+String(profile.full_name||'student').replace(/[^a-z0-9]+/gi,'-')+'-'+(progress?'progress':'profile')+'.png');
}

function aqStorybook(){aqClearPoll();AQ_SCREEN='storybook';scr(`<button class="btn sm" id="aq-back">⬅ Home</button><h1>📚 Owly’s Storybook</h1><div class="aq-book-cover"><div>📖</div><h2>Stories to Read & Learn</h2><p>Little stories, big lessons.</p><span>✨ Aral Quest Library ✨</span></div><div class="aq-story-grid">${AQ_STORIES.map((s,i)=>`<button class="aq-story-card" data-story="${i}"><span>${s.emoji}</span><b>${aqEsc(s.title)}</b><small>${aqEsc(s.lang)} · ${s.pages.length} pages</small></button>`).join('')}</div>`);on('#aq-back',home);app.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>aqReadStory(+b.dataset.story))}
function aqReadStory(i){const s=AQ_STORIES[i];scr(`<button class="btn sm" id="aq-back">⬅ Library</button><div class="aq-open-book"><div class="aq-book-head">${s.emoji} ${aqEsc(s.title)}</div><div class="aq-book-pages">${s.pages.map((p,n)=>`<section class="aq-book-page"><small>PAGE ${n+1}</small><p>${aqEsc(p)}</p></section>`).join('')}</div><div class="aq-book-lesson"><b>🌟 Lesson:</b> ${aqEsc(s.lesson)}</div></div><div style="text-align:center"><button class="btn sm" id="aq-prev" ${i===0?'disabled':''}>⬅ Previous story</button><button class="btn sm" id="aq-next" ${i===AQ_STORIES.length-1?'disabled':''}>Next story ➡</button></div>`);on('#aq-back',aqStorybook);on('#aq-prev',()=>aqReadStory(i-1));on('#aq-next',()=>aqReadStory(i+1))}

/* ---------- home sidebar ---------- */
function aqBuildSidebar(){
  const root=app.querySelector('.scr');if(!root)return;
  // Remove the former row of account/game preference controls from the bottom of the home screen.
  [...root.querySelectorAll('button')].forEach(b=>{const t=b.textContent.toLowerCase();if(t.includes('change name or color')||t.includes('secret code')||t.includes('sound on')||t.includes('sound off')||t.includes('music on')||t.includes('music off')){const p=b.parentElement;if(p)p.remove()}});
  const oldLogoutBtn=$('#lo');if(oldLogoutBtn){const p=oldLogoutBtn.parentElement;if(p)p.remove()}
  const header=root.querySelector('h1');
  if(header&&!$('#aq-homebar'))header.insertAdjacentHTML('beforebegin',`<div id="aq-homebar"><button class="btn sm" id="aq-menu-open">☰ Menu</button><div><b id="aq-season-ribbon"></b><small>Learning together, one star at a time.</small></div></div>`);
  if(!$('#aq-sidebar-wrap'))root.insertAdjacentHTML('afterbegin',`<div id="aq-sidebar-wrap"><button id="aq-sidebar-shade" aria-label="Close menu"></button><aside id="aq-sidebar"><div class="aq-sidebar-head"><span>🦉</span><div><b>Aral Quest</b><small>Student menu</small></div><button id="aq-menu-close" aria-label="Close">×</button></div><button data-aq-nav="profile">👤 My Profile</button><button data-aq-nav="inbox">💌 Inbox & Classmates</button><button data-aq-nav="leaderboard">🏆 Leaderboard</button><button data-aq-nav="storybook">📚 Virtual Storybook</button><button data-aq-nav="themes">🎨 Change theme color</button><button data-aq-nav="secret">🔑 Secret code</button><button data-aq-nav="sound">🔊 Sound</button><button data-aq-nav="music">🎵 Music</button><button data-aq-nav="logout" class="aq-logout">🚪 Log out</button></aside></div>`);
  const quick=$('#aq-home-quick');if(quick)quick.remove();
  const profileImg=root.querySelector('.card img.avt');if(profileImg){profileImg.classList.add('aq-fullphoto')}
  const open=()=>$('#aq-sidebar-wrap').classList.add('open'),close=()=>$('#aq-sidebar-wrap').classList.remove('open');
  on('#aq-menu-open',open);on('#aq-menu-close',close);on('#aq-sidebar-shade',close);
  app.querySelectorAll('[data-aq-nav]').forEach(b=>b.onclick=()=>{close();const n=b.dataset.aqNav;if(n==='profile')aqMyProfile();else if(n==='inbox')aqInbox('admin');else if(n==='leaderboard')aqLeaderboard();else if(n==='storybook')aqStorybook();else if(n==='themes')aqThemeScreen();else if(n==='secret')secret();else if(n==='sound'){S.mute=!S.mute;save();toast(S.mute?'Sound off':'Sound on');home()}else if(n==='music'){S.music=!S.music;save();music(S.music);home()}else if(n==='logout')logout()});
  aqSeasonApply();
}
const aqHomeBase=home;
home=function(){aqClearPoll();aqHomeBase();app.style.maxWidth='760px';if(!ME)return;aqBuildSidebar()};

/* ---------- student inbox and classmate discovery ---------- */
function aqInboxTabs(active){return `<div class="aq-inbox-tabs"><button class="${active==='admin'?'on':''}" data-inbox="admin">💬 Message admin</button><button class="${active==='classmates'?'on':''}" data-inbox="classmates">👥 Classmates</button><button class="${active==='discover'?'on':''}" data-inbox="discover">➕ Add classmates</button><button class="${active==='blocked'?'on':''}" data-inbox="blocked">🚫 Blocked</button></div>`}
function aqBindInboxTabs(){app.querySelectorAll('[data-inbox]').forEach(b=>b.onclick=()=>aqInbox(b.dataset.inbox))}
async function aqInbox(tab='admin'){
  aqClearPoll();AQ_SCREEN='inbox-'+tab;
  if(tab==='admin')return aqStudentAdminInbox();
  if(tab==='classmates')return aqClassmates();
  if(tab==='discover')return aqDiscover();
  if(tab==='blocked')return aqBlocked();
}
async function aqStudentAdminInbox(){const r=await aqApi('student_support_list',{p_token:TOKEN});if(!r.ok)return toast(r.error||'Could not open inbox.');AQ_SUPPORT_REMAINING=r.remaining??5;
  scr(`<button class="btn sm" id="aq-back">⬅ Home</button><h1>💌 Inbox</h1>${aqInboxTabs('admin')}<div class="card aq-inbox-intro">💙 <b>Message your school admin</b><br><small>Ask a question or share a concern. You can send up to 5 messages per day.</small><span>Messages left today: <b id="aq-remaining">${AQ_SUPPORT_REMAINING}</b></span></div><div id="aq-support-messages" class="aq-chat-list">${aqRenderSupport(r.messages||[])}</div><div class="card aq-compose"><textarea id="aq-support-text" maxlength="2000" rows="3" placeholder="Write a message to the admin…"></textarea><button class="btn" id="aq-support-send">Send message 💌</button></div>`);
  on('#aq-back',home);aqBindInboxTabs();on('#aq-support-send',aqSendSupport);AQ_POLL=setInterval(aqRefreshSupport,15000);
}
function aqRenderSupport(messages){return messages.length?messages.map(m=>`<div class="aq-message ${m.sender_kind==='student'?'mine':'theirs'}"><div>${aqEsc(m.body)}</div><small>${m.sender_kind==='student'?'You':'School admin'} · ${new Date(m.created_at).toLocaleString()}</small></div>`).join(''):'<div class="card" style="text-align:center">No messages yet. Send your first message to the admin. 🌷</div>'}
async function aqRefreshSupport(){if(AQ_SCREEN!=='inbox-admin')return;const r=await aqApi('student_support_list',{p_token:TOKEN});if(!r.ok)return;AQ_SUPPORT_REMAINING=r.remaining??AQ_SUPPORT_REMAINING;const box=$('#aq-support-messages');if(box){box.innerHTML=aqRenderSupport(r.messages||[]);box.scrollTop=box.scrollHeight}const left=$('#aq-remaining');if(left)left.textContent=AQ_SUPPORT_REMAINING}
async function aqSendSupport(){const body=val('aq-support-text').trim();if(!body)return toast('Type your message first.');const b=$('#aq-support-send');busy('aq-support-send',1);const r=await aqApi('student_support_send',{p_token:TOKEN,p_body:body});busy('aq-support-send',0);if(!r.ok)return toast(r.error||'Could not send your message.');$('#aq-support-text').value='';await aqRefreshSupport();toast('Message sent to admin! 💌')}
async function aqClassmates(){AQ_SCREEN='inbox-classmates';const [f,q]=await Promise.all([aqApi('student_friends',{p_token:TOKEN}),aqApi('student_friend_requests',{p_token:TOKEN})]);if(!f.ok||!q.ok)return toast(f.error||q.error||'Could not load classmates.');
  scr(`<button class="btn sm" id="aq-back">⬅ Home</button><h1>👥 My Classmates</h1>${aqInboxTabs('classmates')}<div class="card"><b>📨 Incoming requests</b>${q.incoming.length?q.incoming.map(x=>`<div class="aq-person-row">${aqStudentAvatar(x,52)}<div><b>${aqEsc(x.full_name)}</b><small>${aqEsc(x.grade)}</small></div><button class="btn sm" data-request="accept" data-id="${x.id}">Accept</button><button class="btn sm" data-request="reject" data-id="${x.id}">Decline</button></div>`).join(''):'<small>No new requests.</small>'}</div><div class="card"><b>⏳ Sent requests</b>${q.outgoing.length?q.outgoing.map(x=>`<div class="aq-person-row">${aqStudentAvatar(x,52)}<div><b>${aqEsc(x.full_name)}</b><small>Waiting for response</small></div><button class="btn sm" data-request="cancel" data-id="${x.id}">Cancel</button></div>`).join(''):'<small>No pending sent requests.</small>'}</div><div class="card"><b>💗 Accepted classmates</b>${f.friends.length?f.friends.map(x=>`<div class="aq-person-row">${aqStudentAvatar(x,52)}<div><b>${aqEsc(x.full_name)}</b><small>${aqEsc(x.grade||'')} · ${aqStatus(x)}</small></div>${aqStatusDot(x)}<button class="btn sm" data-open-chat="${x.id}" data-name="${aqEsc(x.full_name)}">Message</button><button class="btn sm" data-open-profile="${x.id}">Profile</button></div>`).join(''):'<small>No classmates added yet. Find classmates to get started.</small>'}</div><button class="btn" id="aq-find-friends">➕ Add classmates</button>`);
  on('#aq-back',home);aqBindInboxTabs();on('#aq-find-friends',()=>aqInbox('discover'));
  app.querySelectorAll('[data-request]').forEach(b=>b.onclick=async()=>{const r=await aqApi('student_friend_request_action',{p_token:TOKEN,p_request:b.dataset.id,p_action:b.dataset.request});toast(r.ok?'Request updated.':(r.error||'Could not update request.'));aqClassmates()});
  app.querySelectorAll('[data-open-chat]').forEach(b=>b.onclick=()=>aqChat(b.dataset.openChat,b.dataset.name));app.querySelectorAll('[data-open-profile]').forEach(b=>b.onclick=()=>aqViewProfile(b.dataset.openProfile));
}
async function aqDiscover(query=''){
  AQ_SCREEN='inbox-discover';const r=await aqApi('student_directory',{p_token:TOKEN,p_search:query});if(!r.ok)return toast(r.error||'Could not find classmates.');
  scr(`<button class="btn sm" id="aq-back">⬅ Home</button><h1>➕ Add Classmates</h1>${aqInboxTabs('discover')}<div class="frm card"><label>Search by name or grade</label><input id="aq-search-classmates" placeholder="Type a classmate’s name…" value="${aqEsc(query)}"><button class="btn" id="aq-search-btn">🔍 Search</button></div><div id="aq-directory">${aqRenderDirectory(r.students||[])}</div>`);
  on('#aq-back',home);aqBindInboxTabs();on('#aq-search-btn',()=>aqDiscover(val('aq-search-classmates')));$('#aq-search-classmates').onkeydown=e=>{if(e.key==='Enter')aqDiscover(val('aq-search-classmates'))};

function aqRenderDirectory(rows){return rows.length?rows.map(x=>`<div class="card aq-person-row">${aqStudentAvatar(x,52)}<div><b>${aqEsc(x.full_name)}</b><small>${aqEsc(x.grade||'')} · ${aqStatus(x)}</small></div>${aqStatusDot(x)}${x.request_status==='friends'?`<button class="btn sm" data-view-friend="${x.id}">View profile</button>`:x.request_status==='sent'?'<small>Request sent ✓</small>':x.request_status==='received'?'<button class="btn sm" data-accept-from-directory="1">View requests</button>':`<button class="btn sm" data-add-classmate="${x.id}">Add classmate</button>`}</div>`).join(''):'<div class="card">No classmates found. Try another name or grade.</div>'}
async function aqBlocked(){AQ_SCREEN='inbox-blocked';const r=await aqApi('student_blocked_list',{p_token:TOKEN});if(!r.ok)return toast(r.error||'Could not load blocked list.');scr(`<button class="btn sm" id="aq-back">⬅ Home</button><h1>🚫 Blocked Classmates</h1>${aqInboxTabs('blocked')}<div class="card">You can unblock a classmate here. Unblocking does not automatically send or accept a friend request.</div>${r.blocked.length?r.blocked.map(x=>`<div class="card aq-person-row"><div><b>${aqEsc(x.full_name)}</b><small>${aqEsc(x.grade)}</small></div><button class="btn sm" data-unblock="${x.id}">Unblock</button></div>`).join(''):'<div class="card">You have not blocked anyone.</div>'}`);on('#aq-back',home);aqBindInboxTabs();app.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{const r=await aqApi('student_unblock_classmate',{p_token:TOKEN,p_target:b.dataset.unblock});toast(r.ok?'Classmate unblocked.':(r.error||'Could not unblock'));aqBlocked()})}

  scr(`<button class="btn sm" id="aq-back">⬅ Classmates</button><h1>💬 ${aqEsc(name||'Classmate')}</h1><div class="aq-chat-toolbar"><button class="btn sm" id="aq-chat-profile">👤 View profile</button><button class="btn sm" id="aq-chat-block">🚫 Block</button></div><div id="aq-friend-messages" class="aq-chat-list">${aqRenderFriendMessages(r.messages||[])}</div><div class="card aq-compose"><textarea id="aq-friend-text" rows="2" maxlength="2000" placeholder="Write a kind learning-related message…"></textarea><button class="btn" id="aq-friend-send">Send ➤</button></div>`);
  on('#aq-back',()=>aqInbox('classmates'));on('#aq-chat-profile',()=>aqViewProfile(id));on('#aq-chat-block',async()=>{if(!confirm('Block this classmate?'))return;const b=await aqApi('student_block_classmate',{p_token:TOKEN,p_target:id});toast(b.ok?'Classmate blocked.':(b.error||'Could not block'));aqInbox('classmates')});on('#aq-friend-send',aqSendFriendMessage);aqBindReactions(app);AQ_POLL=setInterval(aqRefreshChat,12000);
}
const AQ_REACTION_SET=['👍','❤️','😂','😮','😢','😡'];
let AQ_REACTION_EFFECT_ID='';
function aqRenderFriendMessages(messages){return messages.length?messages.map(m=>{const id=aqEsc(m.id),reaction=String(m.reaction||'');return `<div class="aq-message ${m.sender_id===ME.id?'mine':'theirs'}" data-message-id="${id}"><div class="aq-message-body">${aqEsc(m.body)}</div><small>${m.sender_id===ME.id?'You':'Classmate'} · ${new Date(m.created_at).toLocaleString()}</small><div class="aq-reaction-area ${reaction?'has-reaction':''}" data-current="${aqEsc(reaction)}"><button type="button" class="aq-react-trigger" data-react-toggle="${id}" aria-label="Add reaction" aria-expanded="false" title="React"><span>☺</span><i>+</i></button><div class="aq-reaction-picker" role="group" aria-label="Choose a reaction">${AQ_REACTION_SET.map((e,i)=>`<button type="button" data-react-message="${id}" data-reaction="${e}" aria-label="React ${e}" title="${['Like','Love','Laugh','Wow','Sad','Angry'][i]}">${e}</button>`).join('')}</div>${reaction?`<button type="button" class="aq-reaction-chip${AQ_REACTION_EFFECT_ID===String(m.id)?' is-pop':''}" data-react-message="${id}" data-reaction="${aqEsc(reaction)}" aria-label="Remove your ${aqEsc(reaction)} reaction">${aqEsc(reaction)}</button>`:''}</div></div>`}).join(''):'<div class="card" style="text-align:center">Say hello and start a learning conversation! 🌱</div>'}
function aqBindReactions(root=app){
  root.querySelectorAll('[data-react-toggle]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const area=b.closest('.aq-reaction-area');if(!area)return;const opening=!area.classList.contains('open');root.querySelectorAll('.aq-reaction-area.open').forEach(x=>{x.classList.remove('open');const t=x.querySelector('[data-react-toggle]');if(t)t.setAttribute('aria-expanded','false')});area.classList.toggle('open',opening);b.setAttribute('aria-expanded',String(opening))}});
  root.querySelectorAll('[data-react-message]').forEach(b=>{b.onclick=e=>{e.stopPropagation();const area=b.closest('.aq-reaction-area');if(area)area.classList.remove('open');aqReact(b.dataset.reactMessage,b.dataset.reaction)}});
}
async function aqRefreshChat(){if(AQ_SCREEN!=='chat'||!AQ_ACTIVE_FRIEND)return;const r=await aqApi('student_get_thread',{p_token:TOKEN,p_friend:AQ_ACTIVE_FRIEND});if(!r.ok)return;const box=$('#aq-friend-messages');if(box){box.innerHTML=aqRenderFriendMessages(r.messages||[]);aqBindReactions(box);box.scrollTop=box.scrollHeight}}
async function aqSendFriendMessage(){const body=val('aq-friend-text').trim();if(!body)return;busy('aq-friend-send',1);const r=await aqApi('student_send_message',{p_token:TOKEN,p_friend:AQ_ACTIVE_FRIEND,p_body:body});busy('aq-friend-send',0);if(!r.ok)return toast(r.error||'Could not send message.');$('#aq-friend-text').value='';await aqRefreshChat()}
async function aqReact(id,emoji){const area=app.querySelector(`[data-message-id="${id}"] .aq-reaction-area`),current=area&&area.dataset.current;const next=current===emoji?null:emoji;const r=await aqApi('student_react_message',{p_token:TOKEN,p_message:id,p_reaction:next});if(!r.ok)toast(r.error||'Could not add reaction.');else{snd(660);AQ_REACTION_EFFECT_ID=next?String(id):'';await aqRefreshChat();setTimeout(()=>{if(AQ_REACTION_EFFECT_ID===String(id))AQ_REACTION_EFFECT_ID=''},500)}}

/* ---------- administrator progress reports ---------- */
async function aqAdminProgress(id){aqClearPoll();AQ_SCREEN='admin-progress';const r=await aqApi('admin_get_progress',{p_token:AT,p_student:id});if(!r.ok)return toast(r.error||'Could not load student progress.');const p=r.profile,g=aqProgressSummary(r.progress||{});

  on('#aq-back',adminPanel);on('#aq-admin-progress-png',()=>aqExportReport('Student Progress Report',p,r.progress||{},'png'));on('#aq-admin-progress-pdf',()=>aqExportReport('Student Progress Report',p,r.progress||{},'pdf'));on('#aq-admin-profile-png',()=>aqExportReport('Student Information',p,null,'png'));
}

/* ---------- administrator leaderboard ---------- */
function aqAdminLeaderboard(){
  aqClearPoll();AQ_SCREEN='admin-leaderboard';
  const rows=AD.list.filter(s=>s.status==='approved').slice().sort((a,b)=>(+b.stars||0)-(+a.stars||0)||String(a.full_name||'').localeCompare(String(b.full_name||'')));
  const medals=['🥇','🥈','🥉'];
  scr(`<button class="btn sm" id="aq-admin-leaderboard-back">⬅ Admin panel</button><h1>🏆 Student Leaderboard</h1><div class="card" style="text-align:center">Admin view · All approved students ranked by total stars.</div><div class="aq-leaderboard">${rows.length?rows.map((s,i)=>`<div class="card aq-rank-row ${i===0?'aq-gold':i===1?'aq-silver':i===2?'aq-bronze':''}"><div class="aq-rank-medal">${medals[i]||'#'+(i+1)}</div>${aqStudentAvatar(s,64)}<div class="aq-rank-info"><b>${aqEsc(s.full_name)}</b><small>${aqEsc(s.grade||'')}</small></div><div class="aq-rank-score"><b>⭐ ${+s.stars||0}</b><small>Level ${aqLevel(s.stars||0)}</small></div></div>`).join(''):'<div class="card">No approved students are on the leaderboard yet.</div>'}</div>` ,true);
  on('#aq-admin-leaderboard-back',adminPanel);
}

async function aqAdminThread(id,name){aqClearPoll();AQ_SCREEN='admin-thread';AQ_SUPPORT_STUDENT=id;const r=await aqApi('admin_support_thread',{p_token:AT,p_student:id});if(!r.ok)return toast(r.error||'Could not load conversation.');

// Keep the shop-equipped character in the existing profile field. This allows the same
// character look to be returned by the existing profile, directory and leaderboard RPCs.
let AQ_CHAR_LAST_TOKEN='',AQ_CHAR_SYNC_TIMER=0,AQ_CHAR_SYNC_BUSY=false,AQ_CHAR_SYNC_AGAIN=false;
async function aqPersistCharacterToProfile(force=false){
  if(!ME||!TOKEN)return;const look=aqEncodeCharacter();if(!force&&look===AQ_CHAR_LAST_TOKEN)return;
  if(AQ_CHAR_SYNC_BUSY){AQ_CHAR_SYNC_AGAIN=true;return}AQ_CHAR_SYNC_BUSY=true;
  try{const r=await aqApi('student_update_profile',{p_token:TOKEN,p_name:ME.full_name||S.name||'Student',p_photo:ME.photo||'',p_bio:ME.bio||'',p_character_id:look,p_hide_profile:!!ME.hide_profile,p_hide_progress:!!ME.hide_progress,p_hide_active:!!ME.hide_active});
    if(r.ok){ME={...ME,...r.profile};AQ_CHAR_LAST_TOKEN=look;}else if(r.error&&!/session/i.test(r.error))console.warn('Could not sync shop character:',r.error);
  }catch(e){console.warn('Could not sync shop character:',e)}finally{AQ_CHAR_SYNC_BUSY=false;if(AQ_CHAR_SYNC_AGAIN){AQ_CHAR_SYNC_AGAIN=false;clearTimeout(AQ_CHAR_SYNC_TIMER);AQ_CHAR_SYNC_TIMER=setTimeout(()=>aqPersistCharacterToProfile(),350)}}
}

window.onSave=()=>{if(typeof aqBaseOnSave==='function')aqBaseOnSave();if(ME){clearTimeout(AQ_CHAR_SYNC_TIMER);AQ_CHAR_SYNC_TIMER=setTimeout(()=>aqPersistCharacterToProfile(),550)}};

};
